
name: Build Client Commands Server Bypass

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Minecraft 26.3 Mod
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Gradle Wrapper permission
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Verify artifact
        shell: bash
        run: |
          JAR="build/libs/clientcommands-server-bypass-1.2.jar"
          if [ ! -f "$JAR" ]; then
            echo "::error::Expected JAR not found: $JAR"
            find build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi
          echo "Build artifact: $JAR"
          ls -lh "$JAR"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: clientcommands-server-bypass-mc26.3
          path: build/libs/clientcommands-server-bypass-1.2.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
